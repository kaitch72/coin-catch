<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coin Catch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-area">

        <!-- TOP BAR -->
        <div id="top-bar">

            <div id="game-title">
                Coin Catch
            </div>

            <!-- Shows the most recently caught coin -->
            <div id="earned-display">
                Catch a coin!
            </div>

            <div id="score">
                $0.00
            </div>

            <div id="timer-container">
                <span id="timer">30</span>
            </div>

        </div>


        <!-- GAME AREA -->
        <div id="game-space">

            <div id="piggy-bank">
                🐷
            </div>

        </div>


        <!-- RESULTS SCREEN -->
        <div id="results-screen">

            <div id="results-box">

                <div class="results-sparkles">
                    ✨ ✨ ✨
                </div>

                <div class="results-pig">
                    🐷
                </div>

                <h1>
                    Great Job!
                </h1>

                <p class="results-message">
                    You caught:
                </p>

                <div id="final-score">
                    $0.00
                </div>

                <p class="results-message">
                    Keep practicing your coin skills!
                </p>

                <button id="play-again">
                    Play Again
                </button>

            </div>

        </div>

    </div>


    <script src="game.js"></script>

</body>
</html>
